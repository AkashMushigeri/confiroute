[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "confiroute"
version = "0.1.0"
description = "Confidence-Aware LLM Routing System for Medical Queries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "pyarrow>=14.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
